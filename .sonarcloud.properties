# SonarQube Cloud — Automatic Analysis configuration
#
# Automatic Analysis (the GitHub-App scan this repo uses) reads this file,
# not sonar-project.properties. Supported keys here are limited to
# exclusions/inclusions, sourceEncoding, python.version and cpd.exclusions.

# The repository is UTF-8 throughout; pin it so the scanner never falls back
# to a platform locale. This clears the "problems with file encoding in the
# source code" analysis warning.
sonar.sourceEncoding=UTF-8

# Binary assets cannot be decoded as text. Keep images, fonts, media and
# documents out of the analysis scope so the encoding check never opens them.
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.bmp,**/*.tif,**/*.tiff,**/*.ttf,**/*.otf,**/*.woff,**/*.woff2,**/*.eot,**/*.mp4,**/*.webm,**/*.mov,**/*.avi,**/*.pptx,**/*.ppt,**/*.pdf,**/*.zip
