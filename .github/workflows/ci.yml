# Release versioning on successful merge to main.
#
# On every push to `main` (i.e. a merged pull request) this workflow:
#   1. derives a build number in the form YYYY.1MMdd.1HHmm (UTC),
#   2. derives the version variables from it,
#   3. generates release notes from the commits since the previous tag,
#   4. creates and pushes the annotated tag named after the build number, and
#   5. publishes a GitHub Release with the generated notes.
#
# The tag is the build number itself (e.g. 2026.11028.11435), without a `v` prefix.
#
# `main` is never modified: the workflow only pushes a tag, so branch protection
# that requires pull requests does not block it. No changelog file is committed.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (YYYY.1MMdd.1HHmm). Leave empty to use the current UTC time.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve build number
        id: build
        shell: pwsh
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_REASON: ${{ github.event_name == 'push' && 'Merge' || 'Manual' }}
        run: |
          $buildNumber = $env:INPUT_BUILD_NUMBER
          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
              $now = [DateTime]::UtcNow
              $buildNumber = '{0}.1{1}.1{2}' -f $now.ToString('yyyy'), $now.ToString('MMdd'), $now.ToString('HHmm')
          }

          if ($buildNumber -notmatch '^\d{4}\.1\d{4}\.1\d{4}(\.\d{1,2})?$') {
              throw "Invalid build number '$buildNumber'. Expected YYYY.1MMdd.1HHmm."
          }

          "BuildNumber=$buildNumber" >> $env:GITHUB_OUTPUT
          "BuildReason=$env:BUILD_REASON" >> $env:GITHUB_OUTPUT

      - name: Skip when the tag already exists
        id: check
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.BuildNumber }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${BUILD_NUMBER}" >/dev/null 2>&1; then
            echo "::notice::Tag ${BUILD_NUMBER} already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version variables
        id: version
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.BuildNumber }}
          BUILD_REASON: ${{ steps.build.outputs.BuildReason }}
        run: |
          $ErrorActionPreference = 'Stop'

          $buildNumber = $env:BUILD_NUMBER
          $buildReason = $env:BUILD_REASON

          $parts = $buildNumber.Split('.')

          $versionMajor = $parts[0]    # yyyy
          $versionMinor = $parts[1]    # 1MMdd
          $versionRevision = $parts[2] # 1HHmm
          $versionBuild = if ($buildReason -eq 'PullRequest') { '{0:D2}' -f (Get-Date).Second } else { 0 }

          $versionNumber = "$versionMajor.$versionMinor.$versionRevision.$versionBuild"
          $versionInformational = "$versionMajor.$versionMinor.$versionRevision"
          $versionPackage = if ($buildReason -eq 'PullRequest') { "$versionInformational-preview" } else { $versionInformational }

          Write-Host "Version Number: $versionNumber"
          Write-Host "Version Informational: $versionInformational"
          Write-Host "Version Package: $versionPackage"

          "VersionNumber=$versionNumber" >> $env:GITHUB_OUTPUT
          "VersionInformational=$versionInformational" >> $env:GITHUB_OUTPUT
          "VersionPackage=$versionPackage" >> $env:GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.BuildNumber }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 --match '[0-9]*' HEAD 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          {
            echo "## ${BUILD_NUMBER} - $(date -u +%Y-%m-%d)"
            echo
            git log --no-merges --pretty=format:'- %s (%h)%n' "$range"
          } > "$notes_file"

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.BuildNumber }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$BUILD_NUMBER" -m "Release $BUILD_NUMBER" HEAD
          git push origin "$BUILD_NUMBER"

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ steps.build.outputs.BuildNumber }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          gh release create "$BUILD_NUMBER" \
            --title "$BUILD_NUMBER" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
